[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-market-replay"
version = "0.0.0"
description = "Point-in-time historical replay framework for multi-market trading research"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Multi-Market contributors"}]
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
multimarket-replay = "multimarket.cli:main"
multimarket-fetch = "multimarket.fetcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
