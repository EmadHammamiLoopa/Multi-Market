[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-market-replay"
version = "0.2.25"
description = "Point-in-time historical replay framework for multi-market trading research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "websockets>=14,<16"]
authors = [{name = "Multi-Market contributors"}]
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
multimarket-replay = "multimarket.cli:main"
multimarket-fetch = "multimarket.fetcher:main"
multimarket-time-machine = "multimarket.time_machine:main"
multimarket-backfill = "multimarket.backfill:main"
multimarket-v1 = "multimarket.v1_cli:main"
multimarket-v1-suite = "multimarket.v1_suite:main"
multimarket-v1-time-machine = "multimarket.v1_time_machine:main"
multimarket-v1-research = "multimarket.v1_research:main"
multimarket-version-compare = "multimarket.version_compare:main"
multimarket-data-quality = "multimarket.data_quality:main"
multimarket-v11-time-machine = "multimarket.v11_time_machine:main"
multimarket-v2-label-audit = "multimarket.v2_label_audit:main"
multimarket-v2-time-machine = "multimarket.v2_time_machine:main"
multimarket-v2-ranking-audit = "multimarket.v2_ranking_audit:main"
multimarket-cross-market-audit = "multimarket.cross_market_audit:main"
multimarket-v21-time-machine = "multimarket.v21_time_machine:main"
multimarket-v21-ranking-audit = "multimarket.v21_ranking_audit:main"
multimarket-v21-combined-audit = "multimarket.v21_combined_audit:main"
multimarket-v22-macro-audit = "multimarket.v22_macro_audit:main"
multimarket-v22-macro-fetch = "multimarket.v22_macro_fetch_frozen:main"
multimarket-v22-freeze-manifests = "multimarket.v22_manifest_freeze:main"
multimarket-v22-combined-audit = "multimarket.v22_combined_audit:main"
multimarket-v23-phase0 = "multimarket.v23_phase0_robust:main"
multimarket-v23-phase0-summary = "multimarket.v23_phase0_summary_robust:main"
multimarket-v23-phase0-batch = "multimarket.v23_phase0_batch:main"
multimarket-v23-phase0b-acquisition-audit = "multimarket.v23_phase0b_acquisition_audit:main"
multimarket-v23-phase0b-ohlc-diagnostic = "multimarket.v23_phase0b_raw_ohlc_diagnostic:main"
multimarket-v23-phase0b-canonicalize-ohlc = "multimarket.v23_phase0b_ohlc_canonicalize:main"
multimarket-v23-phase0c = "multimarket.v23_phase0c:main"
multimarket-v23-phase0c-summary = "multimarket.v23_phase0c_summary:main"
multimarket-v23-phase0c-batch = "multimarket.v23_phase0c_batch:main"
multimarket-v23-phase0cr = "multimarket.v23_phase0cr:main"
multimarket-v23-phase0cr-batch = "multimarket.v23_phase0cr_batch:main"
multimarket-v23-phase0d-collect = "multimarket.v23_phase0d_collect:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
ml = ["xgboost>=2.1,<4", "scikit-learn>=1.5"]
all = ["matplotlib>=3.8", "xgboost>=2.1,<4", "scikit-learn>=1.5"]
